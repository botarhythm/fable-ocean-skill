name: Claude Code

# Issue / PR で「@claude」と書くと Claude Code（Opus 5.5・サブスク認証）が対応する。
# セキュリティ（2026-10-09）:
#  - 起動できるのはリポジトリ所有者 botarhythm 本人の書込みだけ（他人の Issue/コメント経由のプロンプトインジェクション対策）
#  - action は可変タグでなくコミット SHA に固定（タグ差し替え型のサプライチェーン攻撃対策）。更新時は 2 週間以上経った版を選ぶ
#  - 既定権限は空。ジョブに必要な最小権限のみ付与

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions: {}

jobs:
  claude:
    if: |
      github.actor == 'botarhythm' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@9171db3e57d6a3140a37ddc2ba92788584e0ead6 # v1.0.234
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-5-5
            --effort medium
            --max-turns 40
